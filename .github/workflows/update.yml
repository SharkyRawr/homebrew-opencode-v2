name: update formula

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_downgrade:
        description: "Allow updating to a version older than the current formula"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate formula from latest release
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          ALLOW_DOWNGRADE="${ALLOW_DOWNGRADE:-false}"
          FORMULA="Formula/opencode@2.rb"
          API="https://update.opencode.ai/api/latest/cli"
          JSON="$(curl -fsSL --retry 5 --retry-delay 5 "$API")"

          # First opencode artifact only. Validate the version so a malformed
          # or changed API response fails closed instead of injecting into
          # the heredoc, commit message, or grep below.
          VERSION="$(jq -r '[.artifacts[] | select(.distribution == "opencode")][0].version' <<<"$JSON")"
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z._+-]*$ ]] || { echo "bad version: $VERSION"; exit 1; }

          sha() {
            jq -r --arg f "$1" '[.artifacts[] | select(.distribution == "opencode")][0].metadata.files[$f].sha256' <<<"$JSON"
          }

          DARWIN_X64="$(sha opencode-darwin-x64.zip)"
          DARWIN_ARM64="$(sha opencode-darwin-arm64.zip)"
          LINUX_X64="$(sha opencode-linux-x64.tar.gz)"
          LINUX_ARM64="$(sha opencode-linux-arm64.tar.gz)"
          for h in "$DARWIN_X64" "$DARWIN_ARM64" "$LINUX_X64" "$LINUX_ARM64"; do
            [[ "$h" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256: $h"; exit 1; }
          done

          if grep -qF "version \"$VERSION\"" "$FORMULA"; then
            echo "already at $VERSION"
            exit 0
          fi

          # Never silently roll the formula back; re-run manually with the
          # allow_downgrade input to force a downgrade.
          CURRENT="$(sed -n 's/^[[:space:]]*version "\(.*\)"$/\1/p' "$FORMULA")"
          if [ -n "$CURRENT" ] && [ "$ALLOW_DOWNGRADE" != "true" ] &&
             [ "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" = "$CURRENT" ]; then
            echo "refusing downgrade $CURRENT -> $VERSION"
            exit 1
          fi

          cat > "$FORMULA" <<EOF
          # typed: false
          # frozen_string_literal: true

          class OpencodeAT2 < Formula
            desc "The AI coding agent built for the terminal."
            homepage "https://github.com/anomalyco/opencode"
            version "$VERSION"

            depends_on "ripgrep"

            on_macos do
              if Hardware::CPU.intel?
                url "https://opencode.ai/files/bin/$VERSION/opencode-darwin-x64.zip"
                sha256 "$DARWIN_X64"
              end
              if Hardware::CPU.arm?
                url "https://opencode.ai/files/bin/$VERSION/opencode-darwin-arm64.zip"
                sha256 "$DARWIN_ARM64"
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "https://opencode.ai/files/bin/$VERSION/opencode-linux-x64.tar.gz"
                sha256 "$LINUX_X64"
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://opencode.ai/files/bin/$VERSION/opencode-linux-arm64.tar.gz"
                sha256 "$LINUX_ARM64"
              end
            end

            def install
              bin.install "opencode"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/opencode --version")
            end
          end
          EOF

          ruby -c "$FORMULA"

          git add "$FORMULA"
          git -c user.name="opencode-update-bot" \
              -c user.email="actions@github.com" \
              commit -m "opencode@2 $VERSION"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
