name: update formula

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_downgrade:
        description: "Allow updating to a version older than the current formula"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.bottles.outputs.revision }}
      release: ${{ steps.bottles.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate formula from latest release
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          ALLOW_DOWNGRADE="${ALLOW_DOWNGRADE:-false}"
          FORMULA="Formula/opencode@2.rb"
          API="https://opencode.ai/update/api/latest/cli"
          JSON="$(curl -fsSL --retry 5 --retry-delay 5 "$API")"

          # First opencode artifact only. Validate the version so a malformed
          # or changed API response fails closed instead of injecting into
          # the heredoc, commit message, or grep below.
          VERSION="$(jq -r '[.artifacts[] | select(.distribution == "opencode")][0].version' <<<"$JSON")"
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z._+-]*$ ]] || { echo "bad version: $VERSION"; exit 1; }

          sha() {
            jq -r --arg f "$1" '[.artifacts[] | select(.distribution == "opencode")][0].metadata.files[$f].sha256' <<<"$JSON"
          }

          DARWIN_X64="$(sha opencode-darwin-x64.zip)"
          DARWIN_ARM64="$(sha opencode-darwin-arm64.zip)"
          LINUX_X64="$(sha opencode-linux-x64.tar.gz)"
          LINUX_ARM64="$(sha opencode-linux-arm64.tar.gz)"
          for h in "$DARWIN_X64" "$DARWIN_ARM64" "$LINUX_X64" "$LINUX_ARM64"; do
            [[ "$h" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256: $h"; exit 1; }
          done

          if grep -qF "version \"$VERSION\"" "$FORMULA"; then
            echo "already at $VERSION"
            exit 0
          fi

          # Never silently roll the formula back; re-run manually with the
          # allow_downgrade input to force a downgrade.
          CURRENT="$(sed -n 's/^[[:space:]]*version "\(.*\)"$/\1/p' "$FORMULA")"
          if [ -n "$CURRENT" ] && [ "$ALLOW_DOWNGRADE" != "true" ] &&
             [ "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" = "$CURRENT" ]; then
            echo "refusing downgrade $CURRENT -> $VERSION"
            exit 1
          fi

          cat > "$FORMULA" <<EOF
          # typed: false
          # frozen_string_literal: true

          class OpencodeAT2 < Formula
            desc "The AI coding agent built for the terminal."
            homepage "https://github.com/anomalyco/opencode"
            version "$VERSION"

            depends_on "ripgrep"

            on_macos do
              if Hardware::CPU.intel?
                url "https://opencode.ai/files/bin/$VERSION/opencode-darwin-x64.zip"
                sha256 "$DARWIN_X64"
              end
              if Hardware::CPU.arm?
                url "https://opencode.ai/files/bin/$VERSION/opencode-darwin-arm64.zip"
                sha256 "$DARWIN_ARM64"
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "https://opencode.ai/files/bin/$VERSION/opencode-linux-x64.tar.gz"
                sha256 "$LINUX_X64"
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://opencode.ai/files/bin/$VERSION/opencode-linux-arm64.tar.gz"
                sha256 "$LINUX_ARM64"
              end
            end

            def install
              bin.install "opencode"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/opencode --version")
            end
          end
          EOF

          ruby -c "$FORMULA"

          git add "$FORMULA"
          git -c user.name="opencode-update-bot" \
              -c user.email="actions@github.com" \
              commit -m "opencode@2 $VERSION"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push

      - name: Select unbottled formula
        id: bottles
        if: github.ref_name == github.event.repository.default_branch
        run: |
          formula=Formula/opencode@2.rb
          if ! grep -q '^  bottle do$' "$formula"; then
            version=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$formula")
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "release=bottles-$version-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

  bottle:
    needs: update
    if: needs.update.outputs.revision != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Build and test the bottle
        env:
          REVISION: ${{ needs.update.outputs.revision }}
          RELEASE: ${{ needs.update.outputs.release }}
        run: |
          set -euo pipefail
          git checkout --detach "$REVISION"
          formula=sharkyrawr/opencode-v2/opencode@2
          # Intel macOS can require source-built dependencies before --build-bottle.
          brew install --only-dependencies "$formula"
          brew install --build-bottle "$formula"
          brew bottle --json --root-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE" "$formula"
          HOMEBREW_NO_AUTOREMOVE=1 brew uninstall "$formula"
          brew install ./*.bottle*.tar.gz
          brew test "$formula"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.runner }}
          path: |
            *.bottle*.tar.gz
            *.bottle.json
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [update, bottle]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottle-*
          merge-multiple: true

      - name: Publish bottles and commit their checksums
        env:
          REVISION: ${{ needs.update.outputs.revision }}
        run: |
          set -euo pipefail
          git checkout --detach "$REVISION"
          brew pr-upload --no-commit
          ruby -c Formula/opencode@2.rb
          git add Formula/opencode@2.rb
          git -c user.name="opencode-update-bot" -c user.email="actions@github.com" \
            commit -m "Bottle opencode@2 $(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/opencode@2.rb)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
